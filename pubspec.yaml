name: transkriptor_uz
description: "Transkriptor UZ — Uzbek speech-to-text, mobile client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.0.7
  bloc_concurrency: ^0.3.0
  dartz: ^0.10.1
  dio: ^5.11.1
  file_picker: ^13.3.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  injectable: ^3.0.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  pdf: ^3.11.3
  record: ^7.1.2
  share_plus: ^13.3.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
  # The design book's faces (OFL, licences beside them). Variable fonts:
  # the weight axis is driven through `fontVariations` in AppText.
  fonts:
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText-Variable.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Variable.ttf
  generate: true
